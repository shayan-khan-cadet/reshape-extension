# Reshape license server v2 — Cloudflare Workers (free tier)
#
# Deploy from the license-server/ folder in the reshape-extension repo,
# replacing worker.js with the v2 file in this package.
# Your existing KV id stays the same — do NOT create a new KV namespace,
# or all current activations will be lost.

name = "reshape-license"
main = "worker.js"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "LICENSE_KV"
id = "ae0e38142cd346e9a065fb29646fe48c"

# Daily cleanup of stale (> 7 days) bindings. Requires a paid Workers
# plan? No — Cron Triggers are included on the free plan (1 cron per
# account on free). If Cloudflare ever rejects the cron on free, delete
# this whole [triggers] block: lazy expiry on "activate" still works
# without it, the KV just keeps dead entries longer.
[triggers]
crons = ["0 2 * * *"]
